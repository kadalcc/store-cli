<!doctype html>
<!--
  The README's hero: the store, an agent using it, and the terminal. Rendered by render.mjs at 2x
  into ../hero.webp. Designed at 1080 px wide so the owner's legibility rule holds on a 360-pt
  phone: no text under 44 px. The product pictures are the store's own previews; the agent's
  tool calls and the terminal lines are from real runs of the CLI and its MCP server (render.mjs
  says how), shortened where a line says "…".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kadal Store CLI hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07121d;
        --ink: #e8f1f8;
        --muted: #8ea4b6;
        --teal: #5eead4;
        --line: rgba(238, 247, 252, 0.12);
        --panel: rgba(238, 247, 252, 0.05);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1080px;
        padding: 36px 24px 28px;
        background:
          radial-gradient(900px 520px at 0% 0%, rgba(45, 212, 191, 0.2), transparent 70%),
          radial-gradient(900px 700px at 100% 100%, rgba(56, 189, 248, 0.16), transparent 70%),
          var(--bg);
        color: var(--ink);
        font: 500 44px/1.28 Inter, system-ui, sans-serif;
        letter-spacing: -0.01em;
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0;
      }
      .store {
        position: relative;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .tiles img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 22px;
        border: 2px solid var(--line);
      }
      .tiles .pick {
        outline: 6px solid var(--teal);
        outline-offset: 4px;
      }
      .where {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 22px 4px;
        font-weight: 700;
      }
      .where img {
        width: 60px;
        height: 60px;
      }
      .panel {
        margin-top: 30px;
        padding: 30px 32px 34px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 30px;
      }
      .label {
        color: var(--teal);
        font-weight: 700;
      }
      .you {
        margin: 18px 0 22px auto;
        width: fit-content;
        max-width: 92%;
        padding: 14px 26px;
        border-radius: 26px 26px 6px 26px;
        background: var(--teal);
        color: #04121f;
        font-weight: 600;
      }
      .tools {
        color: var(--muted);
        margin-bottom: 14px;
      }
      .tools b {
        color: var(--teal);
      }
      .term {
        padding: 0;
        overflow: hidden;
        background: #050d16;
      }
      .bar {
        display: flex;
        gap: 14px;
        padding: 22px 28px;
        border-bottom: 2px solid var(--line);
      }
      .bar i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #30475c;
      }
      pre {
        padding: 22px 22px 30px;
        font: 500 44px/1.32 "JetBrains Mono", ui-monospace, monospace;
        white-space: pre;
      }
      .p {
        color: var(--teal);
      }
      .ok {
        color: #4ade80;
      }
      .dim {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="store">
      <div class="where"><img src="https://store.kadal.cc/favicon.svg" alt="" />store.kadal.cc</div>
      <div class="tiles">
        <img class="pick" src="https://store.kadal.cc/media/med_5f84f8929f9c418187da41b9157f0ffe" alt="" />
        <img src="https://store.kadal.cc/media/med_a938ec2f4ef24955bd88a7df22c273de" alt="" />
        <img src="https://store.kadal.cc/media/med_a0fda1d72ccb47f79c37ac5a7c707412" alt="" />
        <img src="https://store.kadal.cc/media/med_d2d7e3fecce1475f89976c68a2b992b4" alt="" />
      </div>
    </section>

    <section class="panel">
      <div class="label">✦ Your agent</div>
      <p class="you">Find button sounds for this game.</p>
      <p class="tools mono"><b>✓</b> recommend &nbsp;<b>✓</b> create_buy_link</p>
      <p>One-Name UI Sounds fits, at $12. Here’s a link to review it. Only you can pay.</p>
    </section>

    <section class="panel term">
      <div class="bar"><i></i><i></i><i></i></div>
<pre><span class="p">$</span> kadal-store download soft-ui-sounds
<span class="dim">  …</span>
<span class="ok">  ✓</span> soft-ui-sounds/ui-warning.wav
Done: 41 downloaded, 0 already here.</pre>
    </section>
  </body>
</html>
