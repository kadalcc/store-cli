name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance
  actions: write # start CI on the "Version packages" branch (below)

jobs:
  release:
    if: github.repository == 'kadalcc/store-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (npm >= 11.5.1) trades this job's GitHub OIDC token for a short-lived npm
      # one, so no npm token is stored anywhere; @kadal/store lists kadalcc/store-cli + release.yml
      # as its trusted publisher on npmjs.com. Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@^11.15.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      # Opens a "Version packages" PR while changesets are pending; once that PR is merged (or when
      # package.json holds a version npm hasn't seen, like the first 0.1.0), publishes it to npm
      # with provenance.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: bunx changeset version
          publish: bun run release
          title: "Version packages"
          commit: "Version packages"
          # One release per version (the step below).
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tools/publish.mjs: `direct` (npm publish) unless the repo variable says `stage` or `bootstrap`.
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'direct' }}
          # Only for bootstrapping the package before it exists on npm: `npm stage publish` with an
          # ordinary (2FA-respecting) token, approved on npmjs.com. Unset otherwise; npm uses
          # trusted publishing (OIDC) first whenever the package has a trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # The "Version packages" PR is pushed with GITHUB_TOKEN, which starts no workflow by itself;
      # a dispatch is the one event it may start, so CI runs on the branch as it now stands.
      - if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.published != 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The GitHub release v<version>, with its changelog entry.
      - if: steps.changesets.outputs.published == 'true'
        run: node tools/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
